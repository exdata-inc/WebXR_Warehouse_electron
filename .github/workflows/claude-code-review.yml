name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

permissions:
  contents: write # ブランチを push するため
  issues: write # Issue にコメントするため（long-task-done の付け外しもここ）
  pull-requests: write # PR を作る / 閲覧するため（write は read を含む）
  actions: read # Actions の実行結果・ログ・アーティファクトを見るため（gh run list / view / --log）
  checks: read # PR の CI チェック結果を見るため（gh pr checks / check runs API）
  statuses: read # commit status ベースの CI 結果を見るため
  id-token: write

env:
  CLAUDE_CODE_ENABLE_TELEMETRY: "1"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "otlp"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_EXPORTER_OTLP_ENDPOINT: "https://otlp-gateway-prod-ap-southeast-0.grafana.net/otlp"
  OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Basic Njc0MTA2OmdsY19leUp2SWpvaU9EZ3pOVE0ySWl3aWJpSTZJbk4wWVdOckxUWTNOREV3TmkxcGJuUmxaM0poZEdsdmJpMXZjbUZqYkdVdFpYaGtZWFJoTFdOcFlTMHhJaXdpYXlJNklqRjVlVFl5TjFjNE4wVTRSMDlWWmxneWNuazJlVFpUYnlJc0ltMGlPbnNpY2lJNkluQnliMlF0WVhBdGMyOTFkR2hsWVhOMExUQWlmWDA9"
  OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: "cumulative"
  OTEL_RESOURCE_ATTRIBUTES: "adhd_user=gh-claude-review"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: self-hosted
    # rate limit 時に resetsAt(最大 5h 先)まで待ってから --resume で再開するため、
    # デフォルト 360 分では「実行 120 分 + 待機 + 再開 120 分」が収まらない。余裕を持って 12h。
    timeout-minutes: 720
    container:
      image: ngtystr/rust-obfuscator-llvm:1.93.0-21.1.8-20260710
    # この container では Actions runner が bash を自動検出できず sh フォールバックしていたため、
    # ジョブ全体の run step を bash で実行するよう明示する。bash は image に同梱されている前提。
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare task environment
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'

      # self-hosted runner には gh CLI が無いことが多いので、無ければ portable binary を
      # ~/.local/bin に展開し、GITHUB_PATH に通す（sudo 不要）。既にあれば何もしない。
      # 後続の long-task Issue 解決 / long-task-done 剥がし step が gh を使う。
      - name: Ensure gh CLI is available
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            echo "gh CLI already installed: $(gh --version | head -n1)"
            exit 0
          fi
          VERSION="2.62.0"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64)  GH_ARCH=amd64 ;;
            aarch64) GH_ARCH=arm64 ;;
            *) echo "Unsupported arch: $ARCH" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          tmp=$(mktemp -d)
          curl -fsSL "https://github.com/cli/cli/releases/download/v${VERSION}/gh_${VERSION}_linux_${GH_ARCH}.tar.gz" \
            | tar -xz -C "$tmp"
          install -m 0755 "$tmp/gh_${VERSION}_linux_${GH_ARCH}/bin/gh" "$HOME/.local/bin/gh"
          rm -rf "$tmp"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gh" --version

      # この PR が opportunistic-task.yml の長期タスク由来なら、その元 Issue 番号を突き止める。
      # opportunistic-task が作る PR は
      #   title: `[long-task] <Issue タイトル> (#<issue>)`
      #   body : `Issue #<issue> の長期タスク。...`
      # なので、title / body 中の `#<n>` を候補にして「Issue（PR ではない）かつ long-task 系」を選ぶ。
      # 見つからなければ空を返し、後段の差し戻し step は丸ごとスキップされる（通常の PR レビューと同じ挙動）。
      # PR title / body は必ず env 経由で渡す（run 内に ${{ }} で直書きするとスクリプトインジェクションになる）。
      - name: Resolve linked long-task issue
        id: longtask
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          CANDIDATES=$(printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" \
            | { grep -oE '#[0-9]+' || true; } | tr -d '#' | awk '!seen[$0]++')

          FOUND=""
          for n in $CANDIDATES; do
            json=$(gh api "repos/${REPO}/issues/${n}" 2>/dev/null) || continue
            # PR は /issues/<n> でも引けてしまうので .pull_request で除外する
            [ "$(jq -r 'has("pull_request")' <<<"$json")" = "true" ] && continue
            labels=$(jq -r '[.labels[].name] | join(" ")' <<<"$json")
            body=$(jq -r '.body // ""' <<<"$json")
            case " $labels " in
              *" long-task-done "*|*" long-task "*) FOUND="$n"; break ;;
            esac
            # ラベル運用が無い repo 向けに、本文の long-task キーワードでも拾う
            # （ハブの worker も本文キーワードで検索している）
            if grep -qi 'long-task' <<<"$body"; then FOUND="$n"; break; fi
          done

          echo "issue_number=$FOUND" >> "$GITHUB_OUTPUT"
          if [ -n "$FOUND" ]; then
            echo "→ この PR は long-task Issue #${FOUND} 由来"
          else
            echo "→ long-task Issue に紐づかない通常の PR"
          fi

      # ここで取るのは「初回分」のトークン。長時間実行中に期限切れになるケースは、
      # claude-code-action に claude_oauth_url を渡すことで action 側が同じ URL から
      # 再取得する（下の step の該当コメント参照）。
      - name: Fetch Claude OAuth values
        id: claude-oauth
        env:
          CLAUDE_OAUTH_URL: ${{ secrets.CLAUDE_OAUTH_URL }}
        run: |
          set -euo pipefail
          json=$(curl -fsSL "$CLAUDE_OAUTH_URL")
          access_token=$(printf '%s' "$json" | jq -r '.accessToken')
          expires_at=$(printf '%s' "$json" | jq -r '.expiresAt | tostring')

          if [ "$access_token" = "null" ] || [ -z "$access_token" ]; then
            echo "Failed to read accessToken from JSON response" >&2
            exit 1
          fi
          if [ "$expires_at" = "null" ] || [ -z "$expires_at" ]; then
            echo "Failed to read expiresAt from JSON response" >&2
            exit 1
          fi

          echo "access_token=$access_token" >> "$GITHUB_OUTPUT"
          echo "expires_at=$expires_at" >> "$GITHUB_OUTPUT"

      # ANTHROPIC_BASE_URL が repo の Actions secrets / variables に設定されていれば実行時の環境へ反映する
      #（独自の Anthropic 互換エンドポイント＝gateway やローカル wrapper へ向けたいとき用）。
      # 未設定なら何も足さない（= 既定の OAuth フローのまま）。
      # 空文字で既定を上書きしないよう、値があるときだけ書く。
      - name: Apply Anthropic env overrides (if set)
        env:
          IN_ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL || vars.ANTHROPIC_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -n "${IN_ANTHROPIC_BASE_URL:-}" ]; then
            echo "ANTHROPIC_BASE_URL=${IN_ANTHROPIC_BASE_URL}" >> "$GITHUB_ENV"
            echo "ANTHROPIC_BASE_URL を反映しました: ${IN_ANTHROPIC_BASE_URL}"
          fi
          true

      - name: Run Claude Code Review
        id: claude-review
        uses: ngtystr/claude-code-action@main
        with:
          use_oauth: "true"
          claude_access_token: ${{ steps.claude-oauth.outputs.access_token }}
          claude_refresh_token: "disabled"
          claude_expires_at: ${{ steps.claude-oauth.outputs.expires_at }}
          # 長時間実行中に上の access token が期限切れになる対策。URL 自体を渡しておくと
          # action 側が (1) 期限が近づいたら再取得して ~/.claude/.credentials.json を
          # 書き換え、(2) それでも認証エラーで落ちたら再取得 + --resume で同一セッションを
          # 再開する（rate limit retry と同じ仕組み。max_retries を消費する）。
          claude_oauth_url: ${{ secrets.CLAUDE_OAUTH_URL }}
          # Optional: Specify model (defaults to Claude Sonnet 5, uncomment for Claude Opus 5)
          model: ${{ secrets.ANTHROPIC_MODEL || vars.ANTHROPIC_MODEL || vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
          # モデル別の限度切れ対策(例: claude-fable-5 の限度だけ先に尽きるケース)。
          # 上の model を起点に、rate limit / モデル利用不可(404)を踏んだら序列のより
          # 下位モデルへ --resume で切り替えて作業を継続する(セッション・会話は引き継ぐ)。
          # 序列は「上位 → 下位」。model が序列内にあればその位置から下だけを使い、
          # 無ければ model の次に序列の先頭から続く。リセット時刻まで待った後は序列の
          # 先頭(= 起点モデル)に戻る。新モデルが出たらここに追記するだけでよい。
          model_fallback_chain: |
            claude-fable-5
            claude-opus-5[1m]
            claude-opus-5
            claude-opus-4-8[1m]
            claude-opus-4-8
            claude-sonnet-5
            claude-haiku-4-5
          # claude-code-action の実行時間制限（デフォ 30 分 → 720 分に延長）。
          timeout_minutes: '720'
          # rate limit 対策の retry。stream-json の rate_limit_event を構造的に検知し、
          # resetsAt(リセット時刻)まで一括待機 → `--resume <session-id>` で同一セッションを
          # 再開する。会話コンテキストが引き継がれるので、中断までに使ったトークン
          # (数十ターン分の作業)が無駄にならない。resetsAt が取れない失敗は 60s 間隔で
          # 再試行(上限 120 回)。rate limit 以外の失敗は従来どおり即 fail。
          # 単発待機の上限はデフォルト 8h(retry_max_wait_seconds)。job の timeout-minutes: 720
          # とセットで運用する。
          max_retries: '120'
          retry_interval_seconds: '60'

          # Direct prompt for automated review (no @claude mention needed)
          # 末尾の verdict マーカーは後段の "Reopen long-task on critical findings" step が
          # パースして long-task-done ラベルの剥がし判定に使う。書式を変えるときは両方直すこと。
          direct_prompt: |
            この pull request をレビューして、日本語でフィードバックしてください。観点:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            建設的で具体的に（該当箇所は `path:line` 形式で示す）。

            ## 指摘の重大度分類（必須）
            各指摘に `critical` / `major` / `minor` のいずれかを付けてください。

            - `critical`: **マージすると壊れる/危険なもの**だけ。例: 明確なバグ・ロジック誤り、
              クラッシュ、データ破壊・データ欠損、セキュリティ脆弱性（インジェクション・権限漏れ・
              シークレット露出）、ビルド/型/テストが通らない、既存機能のリグレッション。
            - `major`: 直すべきだが壊れてはいない設計・保守性・性能上の問題。
            - `minor`: nit、命名、コメント、好みの範囲。

            **`critical` は厳しく判定してください（保守的に）**。スタイル・好み・「あったら良いテスト」は
            critical にしない。`critical` があると、この PR の元になった長期タスク Issue の
            `long-task-done` ラベルが自動で外れ、bot が自動修正を再開します（人間の手を介さない）。
            つまり critical の誤検知はムダな自動作業を発生させます。

            `critical` が 1 件以上あるときは、レビュー本文に `## Critical` 見出しを作り、
            その配下に修正すべき内容を箇条書き（`path:line` + 何が起きるか + どう直すか）で
            まとめてください。修正担当の bot はここだけを見て作業します。

            ## 出力の最後に必ず verdict を付ける
            レビュー本文の **最終行** に、下記のどちらか **1 行だけ** をそのまま出力してください
            （HTML コメントなので人間には見えません。機械が読みます）。

            - critical が 1 件以上あるとき: `<!-- review-verdict: critical -->`
            - critical が 0 件のとき（major/minor だけ、または指摘なし）: `<!-- review-verdict: ok -->`

          # Optional: Customize review based on file types
          # direct_prompt: |
          #   Review this PR focusing on:
          #   - For TypeScript files: Type safety and proper interface usage
          #   - For API endpoints: Security, input validation, and error handling
          #   - For React components: Performance, accessibility, and best practices
          #   - For tests: Coverage, edge cases, and test quality

          # Optional: Different prompts for different authors
          # direct_prompt: |
          #   ${{ github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' &&
          #   'Welcome! Please review this PR from a first-time contributor. Be encouraging and provide detailed explanations for any suggestions.' ||
          #   'Please provide a thorough code review focusing on our coding standards and best practices.' }}

          # Optional: Add specific tools for running tests or linting
          # allowed_tools: "Bash(npm run test),Bash(npm run lint),Bash(npm run typecheck)"

          # Optional: Skip review for certain conditions
          # if: |
          #   !contains(github.event.pull_request.title, '[skip-review]') &&
          #   !contains(github.event.pull_request.title, '[WIP]')

      # レビューで critical 指摘が出た場合、元の long-task Issue から long-task-done を外して
      # opportunistic-task の抽選対象に戻す（= 人間の再対応待ちにせず、bot が自動で直しに行く）。
      #
      # 判定材料は上の review step が PR に投稿したコメント末尾の
      #   <!-- review-verdict: critical | ok -->
      # マーカー。PR のコメント / review を updated_at 順に見て **最新のもの** を採用する
      # （synchronize で何度もレビューが走るので、古い critical を掘り返さないため）。
      #
      # 差し戻しは「Issue に long-task-done が付いている（= bot が完了宣言してレビュー待ち）」
      # ときだけ行う。まだ作業中の PR に critical が出ても、次の dispatch で普通に続きを
      # やるのでラベルを触る必要はない。
      #
      # 無限ピンポン防止: 自動差し戻しは MAX_AUTO_REVIEW_ROUNDS 回まで（既定 3）。
      # 超えたらラベルは外さず、Issue 作成者にメンションして人間に渡す。
      - name: Reopen long-task on critical findings
        if: steps.longtask.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ISSUE_NUMBER: ${{ steps.longtask.outputs.issue_number }}
          MAX_ROUNDS: ${{ vars.MAX_AUTO_REVIEW_ROUNDS || '3' }}
        run: |
          set -euo pipefail

          # --- 1. 最新の verdict マーカー付きコメントを取る ---
          LATEST=$(
            {
              gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
                --jq '.[] | {t: (.updated_at // .created_at // ""), b: (.body // ""), u: (.html_url // "")}'
              gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
                --jq '.[] | {t: (.submitted_at // ""), b: (.body // ""), u: (.html_url // "")}'
            } | jq -s -c '
                [ .[] | select(.b | test("<!--[[:space:]]*review-verdict:")) ]
                | sort_by(.t) | (last // {})'
          )
          VERDICT=$(jq -r '.b // ""' <<<"$LATEST" \
            | { grep -oiE 'review-verdict:[[:space:]]*(critical|ok)' || true; } \
            | tail -n1 | awk -F: '{print $2}' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          REVIEW_URL=$(jq -r '.u // ""' <<<"$LATEST")

          if [ "$VERDICT" != "critical" ]; then
            echo "verdict=${VERDICT:-（マーカー無し）} → ラベルはそのまま（人間のレビュー待ち）"
            exit 0
          fi

          # --- 2. long-task-done が付いているときだけ差し戻す ---
          ISSUE_JSON=$(gh api "repos/${REPO}/issues/${ISSUE_NUMBER}")
          LABELS=$(jq -r '[.labels[].name] | join(" ")' <<<"$ISSUE_JSON")
          ISSUE_USER=$(jq -r '.user.login // ""' <<<"$ISSUE_JSON")
          ISSUE_STATE=$(jq -r '.state // ""' <<<"$ISSUE_JSON")
          ISSUE_URL=$(jq -r '.html_url // ""' <<<"$ISSUE_JSON")

          case " $LABELS " in
            *" long-task-done "*) ;;
            *) echo "Issue ${ISSUE_URL} に long-task-done が無い（まだ作業中）→ 何もしない"; exit 0 ;;
          esac

          # --- 3. 自動差し戻しのラウンド数（未解決の review-feedback コメント数 + 1）---
          ROUNDS=$(gh api --paginate "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" \
            --jq '[ .[] | select((.body // "") | test("<!--[[:space:]]*review-feedback[[:space:]]") and ((.body // "") | test("(?m)^resolved:[[:space:]]*yes[[:space:]]*$") | not)) ] | length')
          ROUND=$((ROUNDS + 1))
          echo "自動差し戻し round=${ROUND} / 上限=${MAX_ROUNDS}"

          if [ "$ROUND" -gt "$MAX_ROUNDS" ]; then
            # YAML ブロックスカラー内では heredoc の終端子を行頭に置けないので printf で組む
            printf '%s\n' \
              "## 🛑 自動修正の上限に到達" \
              "" \
              "自動レビューで critical 指摘が出ましたが、自動差し戻しは既に ${MAX_ROUNDS} 回行っているため" \
              "\`long-task-done\` は外しません（bot と reviewer の無限ピンポン防止）。" \
              "" \
              "@${ISSUE_USER} 人間による判断をお願いします。" \
              "" \
              "- PR: ${PR_URL}" \
              "- レビュー: ${REVIEW_URL}" \
              "- 再開したいときは \`long-task-done\` ラベルを手で外してください。" \
              > /tmp/review-giveup.md
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/review-giveup.md
            exit 0
          fi

          # --- 4. ラベルを外して差し戻し、修正指示を Issue に残す ---
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label long-task-done
          if [ "$ISSUE_STATE" = "closed" ]; then
            # ハブの worker は state:open しか拾わないので開け直す
            gh issue reopen "$ISSUE_NUMBER" --repo "$REPO"
          fi

          printf '%s\n' \
            "<!-- review-feedback pr=${PR_NUMBER} round=${ROUND} -->" \
            "## ⚠️ 自動レビューで critical 指摘 (round ${ROUND}/${MAX_ROUNDS})" \
            "" \
            "- PR: ${PR_URL}" \
            "- レビュー本文（\`## Critical\` 見出しを参照）: ${REVIEW_URL}" \
            "" \
            "\`long-task-done\` ラベルを外しました。次の opportunistic-task dispatch は" \
            "**この critical 指摘の解消を最優先**で進めてください。" \
            "" \
            "- critical 指摘を進捗コメントの「完了条件 (DoD)」へ未チェック項目として追加すること。" \
            "- 対応が終わったら、**このコメントの末尾に \`resolved: yes\` の行を追記**してから" \
            "  \`long-task-done\` を付け直すこと。" \
            "- \`resolved: yes\` が無い review-feedback コメントが残っている間は" \
            "  \`long-task-done\` を付けないこと。" \
            > /tmp/review-feedback.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/review-feedback.md

          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body "critical 指摘があったため、元の long-task Issue の \`long-task-done\` を外して自動修正キューへ戻しました: ${ISSUE_URL}"

          echo "→ Issue ${ISSUE_URL} の long-task-done を外しました"

      # このジョブはコンテナ内で root として動くため、checkout / cargo が生成した
      # ファイルは host 上で root 所有になる。次に同じ self-hosted runner で
      # コンテナを使わないワークフロー(main 等)が動くと、runner ユーザーがそれらを
      # 削除できず checkout(git clean) が "permission denied" でコケる。
      # そこで (1) 所有者をマウント元 /__w(= runner ユーザー)に戻し、(2) 中身を削除する。
      # ビルドが途中で失敗しても必ず後始末されるよう if: always() を付ける。
      - name: Cleanup Directory
        if: always()
        run: |
          chown -R --reference=/__w /__w 2>/dev/null || true
          rm -rf -- "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* "$GITHUB_WORKSPACE"/..?* 2>/dev/null || true
