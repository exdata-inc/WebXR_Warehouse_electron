# 各 repo の .github/workflows/opportunistic-task.yml に置く受け手側 workflow のテンプレ。
# ハブ repo の .github/workflows/opportunistic-worker.yml がここに workflow_dispatch を投げる。
#
# 仕組み（Issue ベース）:
#   - 1 つの GitHub Issue = 1 つの長期タスク。本文に「long-task」キーワードを含めると
#     ハブの worker の検索（org:exdata-inc is:issue state:open long-task -label:long-task-done）に拾われる
#   - 起動されると、この workflow が Issue 本文と既存 bot コメントを読み、作業ブランチ名を確定する:
#       1. 既存 bot コメントの先頭メタ行 `working_branch: <name>` があればそれ
#       2. なければ Issue 本文の `working_branch: <name>` 行
#       3. どちらも無ければ `claude/task-<issueNumber>-<title-slug>` を自動生成
#   - claude-code-action に `working_branch` で渡し、そのブランチに commit を積む（既存 PR があれば継続）
#   - 進捗は Issue 内の bot コメント 1 件を毎回 PATCH で上書き
#   - タスク全体が終わったら claude が long-task-done ラベルを付け、作成者にメンション
#   - その PR を claude-code-review.yml がレビューし、**critical 指摘があると**
#     long-task-done を自動で外して Issue に `<!-- review-feedback ... -->` コメントを残す。
#     → 次の dispatch でその critical 指摘の修正が最優先で進む（人間の再対応を待たない）。
#     自動差し戻しは vars.MAX_AUTO_REVIEW_ROUNDS 回まで（既定 3、claude-code-review.yml 側で制御）。
#
# 配置手順:
#   1. このファイルを対象 repo の .github/workflows/opportunistic-task.yml にコピー（ファイル名 固定）。
#   2. 対象 repo の secrets に CLAUDE_OAUTH_URL を入れる。
#   3. ハブが Issue search で勝手に拾うので、対象 repo に long-task Issue を立てるだけで投入される。
#
# 重要:
#   - このテンプレは 1〜5 ステップだけ進めて commit する設計。終了まで延々と回さないこと。

name: Opportunistic long-running task

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'long-task Issue 番号（このリポジトリ内）'
        required: true

permissions:
  contents: write
  pull-requests: write # PR を作る / 閲覧するため（write は read を含む）
  issues: write
  actions: read # Actions の実行結果・ログ・アーティファクトを見るため（gh run list / view / --log）
  checks: read # PR の CI チェック結果を見るため（gh pr checks / check runs API）
  statuses: read # commit status ベースの CI 結果を見るため
  id-token: write

env:
  CLAUDE_CODE_ENABLE_TELEMETRY: "1"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "otlp"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_EXPORTER_OTLP_ENDPOINT: "https://otlp-gateway-prod-ap-southeast-0.grafana.net/otlp"
  OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Basic Njc0MTA2OmdsY19leUp2SWpvaU9EZ3pOVE0ySWl3aWJpSTZJbk4wWVdOckxUWTNOREV3TmkxcGJuUmxaM0poZEdsdmJpMXZjbUZqYkdVdFpYaGtZWFJoTFdOcFlTMHhJaXdpYXlJNklqRjVlVFl5TjFjNE4wVTRSMDlWWmxneWNuazJlVFpUYnlJc0ltMGlPbnNpY2lJNkluQnliMlF0WVhBdGMyOTFkR2hsWVhOMExUQWlmWDA9"
  OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: "cumulative"
  OTEL_RESOURCE_ATTRIBUTES: "adhd_user=gh-op-task"

concurrency:
  # 同じ Issue に対する dispatch は直列化（複数同時実行で commit / コメントが衝突しないように）。
  group: opportunistic-task-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  long-task:
    runs-on: self-hosted
    # rate limit 時に resetsAt(最大 5h 先)まで待ってから --resume で再開するため、
    # デフォルト 360 分では「実行 120 分 + 待機 + 再開 120 分」が収まらない。余裕を持って 12h。
    timeout-minutes: 720
    container:
      image: ngtystr/rust-dev-env:1.93.0-21.1.8-20260827
    # この container では Actions runner が bash を自動検出できず sh フォールバックしていたため、
    # ジョブ全体の run step を bash で実行するよう明示する。bash は image に同梱されている前提。
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout default branch
        # 一部 submodule（外部 org や SSH 形式 URL 等）で fetch がコケても、親 repo が
        # 取れていれば claude 側で必要な submodule だけ後から init する運用にできる。
        # ここで赤くしてジョブ全体を止めない。
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          # private な submodule を含む repo では default の GITHUB_TOKEN では
          # submodule の clone に権限が無くコケる。GH_TOKEN_SUBMODULE_RW が設定されて
          # いればそれを使い（各 submodule 上流にも contents:read を持つ想定）、
          # 未設定なら従来どおり GITHUB_TOKEN で動く。checkout@v4 は with.token を
          # submodule fetch にも使う。
          token: ${{ secrets.GH_TOKEN_SUBMODULE_RW || github.token }}

      - name: Prepare task environment
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'

      # self-hosted runner には gh CLI が無いことが多いので、無ければ portable binary を
      # ~/.local/bin に展開し、GITHUB_PATH に通す（sudo 不要）。既にあれば何もしない。
      # 後続の Resolve working branch step や claude の direct_prompt 内 (gh issue view 等) が
      # gh を使う前提で書かれているため、Job 冒頭で確保しておく。
      - name: Ensure gh CLI is available
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            echo "gh CLI already installed: $(gh --version | head -n1)"
            exit 0
          fi
          VERSION="2.62.0"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64)  GH_ARCH=amd64 ;;
            aarch64) GH_ARCH=arm64 ;;
            *) echo "Unsupported arch: $ARCH" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          tmp=$(mktemp -d)
          curl -fsSL "https://github.com/cli/cli/releases/download/v${VERSION}/gh_${VERSION}_linux_${GH_ARCH}.tar.gz" \
            | tar -xz -C "$tmp"
          install -m 0755 "$tmp/gh_${VERSION}_linux_${GH_ARCH}/bin/gh" "$HOME/.local/bin/gh"
          rm -rf "$tmp"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gh" --version

      # everything-claude-code (ECC) を ~/.claude/ 配下にインストールする。
      # install.sh は内部で `npm install` → `node scripts/install-apply.js --profile full` を叩くだけなので、
      # rust-obfuscator コンテナ同梱の bun でその 2 手を直接踏む（node/npm を用意しなくて済む）。
      # 結果として agents / skills / rules / hooks 一式が ~/.claude/{agents,skills,rules,hooks}/ecc/ に配置される。
      # ECC のリビジョンは vars.ECC_REF で差し替え可能（未設定なら main の HEAD）。
      - name: Install everything-claude-code (ECC)
        env:
          ECC_REF: ${{ vars.ECC_REF || 'main' }}
        run: |
          set -euo pipefail
          if ! command -v bun >/dev/null 2>&1; then
            echo "bun が見つからない。rust-obfuscator コンテナには入っている想定なので、image の変更等で消えていないか確認して。" >&2
            exit 1
          fi
          echo "bun version: $(bun --version)"
          tmp=$(mktemp -d)
          git clone https://github.com/affaan-m/ECC "$tmp/ECC"
          git -C "$tmp/ECC" checkout "$ECC_REF"
          cd "$tmp/ECC"
          bun install
          bun scripts/install-apply.js --profile full
          echo "=== ~/.claude 配下 ==="
          ls -la "$HOME/.claude" 2>/dev/null || echo "(空)"
          for d in agents skills rules hooks; do
            if [ -d "$HOME/.claude/$d/ecc" ]; then
              echo "-- $d/ecc --"
              ls "$HOME/.claude/$d/ecc" | head -n 20
            fi
          done

      # Issue 本文 + 既存 bot コメントから「使うブランチ名」「Issue 作成者」を決定する。
      # bot コメントの working_branch 行が最優先 → Issue 本文の working_branch 行 → 自動生成。
      - name: Resolve working branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          # Issue メタ
          ISSUE_JSON=$(gh api "repos/${REPO}/issues/${ISSUE_NUMBER}")
          ISSUE_TITLE=$(jq -r '.title // ""' <<<"$ISSUE_JSON")
          ISSUE_USER=$(jq -r '.user.login // ""' <<<"$ISSUE_JSON")
          ISSUE_BODY=$(jq -r '.body // ""' <<<"$ISSUE_JSON")

          # 既存 bot コメント（本文が `## opportunistic-task progress` で始まるもの 1 件）
          BOT_BODY=$(gh api --paginate "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("## opportunistic-task progress")) | .body] | first // ""')

          # 優先順位: bot コメント > Issue 本文 > 自動生成
          # grep がマッチしないと exit 1 を返し、pipefail + set -e で script が落ちるので
          # `|| true` でパイプライン全体を「マッチ無し = 空文字」として扱う。
          extract_wb() {
            printf '%s\n' "$1" \
              | { grep -oE '^working_branch:[[:space:]]+\S+' || true; } \
              | head -n1 \
              | awk '{print $2}'
          }
          WB=$(extract_wb "$BOT_BODY")
          [ -z "$WB" ] && WB=$(extract_wb "$ISSUE_BODY") || true
          if [ -z "$WB" ]; then
            SLUG=$(printf '%s' "$ISSUE_TITLE" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-//; s/-$//' \
              | cut -c1-40)
            WB="claude/task-${ISSUE_NUMBER}-${SLUG:-x}"
          fi

          echo "working_branch=$WB" >> "$GITHUB_OUTPUT"
          echo "issue_user=$ISSUE_USER" >> "$GITHUB_OUTPUT"
          # タイトルに改行や " が混入しても壊さないよう、heredoc で出力
          {
            echo "issue_title<<EOF"
            printf '%s\n' "$ISSUE_TITLE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "→ Issue #${ISSUE_NUMBER} by @${ISSUE_USER}"
          echo "→ working_branch=$WB"

      # ハブ repo の claude-triage.yml と同じ OAuth 取得パターン。
      # ここで取るのは「初回分」のトークン。長時間実行中に期限切れになるケースは、
      # claude-code-action に claude_oauth_url を渡すことで action 側が同じ URL から
      # 再取得する（下の step の該当コメント参照）。
      - name: Fetch Claude OAuth values
        id: claude-oauth
        env:
          CLAUDE_OAUTH_URL: ${{ secrets.CLAUDE_OAUTH_URL }}
          IN_ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN || vars.ANTHROPIC_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${IN_ANTHROPIC_AUTH_TOKEN:-}" ]; then
            echo "ANTHROPIC_AUTH_TOKEN が設定されているので OAuth はスキップ"
            exit 0
          fi
          json=$(curl -fsSL "$CLAUDE_OAUTH_URL")
          access_token=$(printf '%s' "$json" | jq -r '.accessToken')
          expires_at=$(printf '%s' "$json" | jq -r '.expiresAt | tostring')
          [ "$access_token" = "null" ] || [ -z "$access_token" ] && { echo "accessToken 取得失敗" >&2; exit 1; }
          [ "$expires_at" = "null" ] || [ -z "$expires_at" ] && { echo "expiresAt 取得失敗" >&2; exit 1; }
          echo "access_token=$access_token" >> "$GITHUB_OUTPUT"
          echo "expires_at=$expires_at" >> "$GITHUB_OUTPUT"

      # ANTHROPIC_BASE_URL / ANTHROPIC_AUTH_TOKEN が repo の Actions secrets / variables に設定されていれば実行時の環境へ反映する
      #（独自の Anthropic 互換エンドポイント＝gateway やローカル wrapper へ向けたいとき用）。
      # 未設定なら何も足さない（= 既定の OAuth フローのまま）。
      # 空文字で既定を上書きしないよう、値があるときだけ書く。
      - name: Apply Anthropic env overrides (if set)
        env:
          IN_ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL || vars.ANTHROPIC_BASE_URL }}
          IN_ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN || vars.ANTHROPIC_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${IN_ANTHROPIC_BASE_URL:-}" ]; then
            echo "ANTHROPIC_BASE_URL=${IN_ANTHROPIC_BASE_URL}" >> "$GITHUB_ENV"
            echo "ANTHROPIC_BASE_URL を反映しました: ${IN_ANTHROPIC_BASE_URL}"
          fi
          if [ -n "${IN_ANTHROPIC_AUTH_TOKEN:-}" ]; then
            echo "ANTHROPIC_AUTH_TOKEN=${IN_ANTHROPIC_AUTH_TOKEN}" >> "$GITHUB_ENV"
            echo "ANTHROPIC_AUTH_TOKEN を反映しました: ${IN_ANTHROPIC_AUTH_TOKEN}"
          fi
          true

      - name: Run one step of long-running task
        uses: ngtystr/claude-code-action@main
        with:
          use_oauth: 'true'
          claude_access_token: ${{ steps.claude-oauth.outputs.access_token || env.ANTHROPIC_AUTH_TOKEN || '' }}
          claude_refresh_token: "disabled"
          claude_expires_at: ${{ steps.claude-oauth.outputs.expires_at || '9999999999999' }}
          # 長時間実行中に上の access token が期限切れになる対策。URL 自体を渡しておくと
          # action 側が (1) 期限が近づいたら再取得して ~/.claude/.credentials.json を
          # 書き換え、(2) それでも認証エラーで落ちたら再取得 + --resume で同一セッションを
          # 再開する（rate limit retry と同じ仕組み。max_retries を消費する）。
          claude_oauth_url: ${{ secrets.CLAUDE_OAUTH_URL }}
          model: ${{ secrets.ANTHROPIC_MODEL || vars.ANTHROPIC_MODEL || vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
          # モデル別の限度切れ対策(例: claude-fable-5 の限度だけ先に尽きるケース)。
          # 上の model を起点に、rate limit / モデル利用不可(404)を踏んだら序列のより
          # 下位モデルへ --resume で切り替えて作業を継続する(セッション・会話は引き継ぐ)。
          # 序列は「上位 → 下位」。model が序列内にあればその位置から下だけを使い、
          # 無ければ model の次に序列の先頭から続く。リセット時刻まで待った後は序列の
          # 先頭(= 起点モデル)に戻る。新モデルが出たらここに追記するだけでよい。
          model_fallback_chain: |
            claude-fable-5
            claude-opus-5[1m]
            claude-opus-5
            claude-opus-4-8[1m]
            claude-opus-4-8
            claude-sonnet-5
            claude-haiku-4-5
          github_token: ${{ github.token }}
          # claude-code-action の実行時間制限（デフォ 30 分 → 720 分に延長）。
          timeout_minutes: '720'
          # rate limit 対策の retry。stream-json の rate_limit_event を構造的に検知し、
          # resetsAt(リセット時刻)まで一括待機 → `--resume <session-id>` で同一セッションを
          # 再開する。会話コンテキストが引き継がれるので、中断までに使ったトークン
          # (数十ターン分の作業)が無駄にならない。resetsAt が取れない失敗は 60s 間隔で
          # 再試行(上限 120 回)。rate limit 以外の失敗は従来どおり即 fail。
          # 単発待機の上限はデフォルト 8h(retry_max_wait_seconds)。job の timeout-minutes: 720
          # とセットで運用する。
          max_retries: '120'
          retry_interval_seconds: '60'
          # 上のステップで確定したブランチを直接指定（action 側は sanitize せずそのまま使う）。
          # 既存ブランチがあれば fetch & checkout、無ければ default branch から create。
          # 同 head の open PR があれば action 側で existingPrNumber が立つ。
          working_branch: ${{ steps.branch.outputs.working_branch }}
          # action のベース許可は
          #   Edit / MultiEdit / Glob / Grep / LS / Read / Write /
          #   mcp__github_file_ops__{commit_files,delete_files,update_claude_comment}
          # だけ。ここに書かなかったツールは実行時に denied になるので、
          # direct_prompt が使えと言っている操作は漏れなく列挙しておくこと。
          #   Skill / SlashCommand : ECC の skills（tdd-workflow / security-scan 等）の起動に必要。
          #                          これが無いと「ECC を積極的に使え」と指示しているのに
          #                          skill 呼び出しが弾かれていた。
          #   NotebookEdit         : .ipynb を含む repo 用
          #   create_issue / update_issue_comment / list_issues
          #                        : 進捗 bot コメントの更新・関連 Issue の確認に使う
          #                          （gh 経由でも可能だが MCP 側も塞がない）
          allowed_tools: |
            Bash
            WebFetch
            WebSearch
            Skill
            SlashCommand
            NotebookEdit
            mcp__github_file_ops__commit_files
            mcp__github_file_ops__create_pull_request
            mcp__github_file_ops__create_issue
            mcp__github_file_ops__update_issue_comment
            mcp__github_file_ops__list_issues
          # 内蔵プロンプトの CAPABILITIES AND LIMITATIONS 節が実態と合っておらず、
          # claude が「権限が無い」と誤解して作業を放棄する事故が続いたため上書きする
          #（詳しい経緯は claude.yml の同じ箇所のコメントを参照）。
          # custom_instructions はプロンプト末尾に追記されるので direct_prompt より後に効く。
          custom_instructions: |
            ## 実行環境と権限の実態（内蔵プロンプトの CAPABILITIES AND LIMITATIONS 節より優先すること）

            このジョブは self-hosted runner の Docker コンテナ内で **root** として動いています。
            下記はすべて実行できます。「権限が無い」と言って諦めないでください。

            - **Bash は全面的に許可済み**です。任意のコマンド・任意のスクリプトを実行してよい。
              同梱済み（すべて PATH 済み）: `python` / `python3` / `pip`（/opt/venv）、`node` / `npm`、
              `bun`、`cargo` / `rustc` / `clang`、`java` / `mvn` / `gradle`、`gh`、`git`、`jq`、`curl`、
              `make` / `cmake`、`sudo`、`brew`(linuxbrew)。
              足りないものは `pip install` / `npm i` / `brew install` で入れてよい（ネットワーク可）。
            - **ビルド・テストは必ず実際に走らせてから commit** すること（手順 5 の「落ちたら直す」は
              実行が前提）。「実行できないので未検証」で commit しない。
            - **GitHub Actions のログ・CI 結果は見られます**（actions:read / checks:read /
              statuses:read 付与済み）。`gh run list` / `gh run view --log` / `gh pr checks` を使ってよい。
              内蔵プロンプトの「CI の結果は見られない」は誤りです。
            - **PR は手順 7 のとおり `gh pr create` で自分で作ってください。**
              「Create a PR」リンクを貼って終わりにしないこと。
            - git 操作（commit / push / rebase）は作業ブランチに対して可能です。
              ただし禁止事項（別ブランチを切らない・デフォルトブランチへ直 push しない）は厳守。

            ## 本当に存在する制限
            - `.github/workflows/` 配下の変更は GITHUB_TOKEN では push が拒否されます。
              必要なら差分を提案として Issue にコメントし、人間にメンションすること。

            ## ツールが denied されたとき
            「権限がありませんでした」で終わらせないこと。**弾かれたツール名と実行しようとした
            コマンドをそのまま**進捗 bot コメントの「詰まり・要相談メモ」に書いてください
            （例: `Bash(pytest -q)` が denied）。`allowed_tools` を直す手掛かりになります。
          direct_prompt: |
            あなたは Issue ベースの長期タスクの「1〜5 ステップだけ進める」担当です。

            ## everything-claude-code (ECC) が有効
            この runner には ECC (https://github.com/affaan-m/ECC) が `--profile full` でインストール済みで、
            `~/.claude/{agents,skills,rules,hooks}/ecc/` に一式が配置されています。ECC の agents (planner /
            code-reviewer / security-reviewer / language-specific reviewers 等) や skills (tdd-workflow /
            security-scan / research-first 等) を **本タスクに関係するものは積極的に呼び出して**ください
            （例: 実装前に planner agent で最小ステップを設計、実装後に code-reviewer / security-reviewer
            を通す、テスト追加時は tdd-workflow skill を利用、など）。
            ただし本テンプレの「1 dispatch = 1〜5 ステップ」原則は変えない（ECC を回すために dispatch を
            膨らませない）。skill / agent は 1 ステップの品質を上げるための道具として使う。

            ## 対象
            - Issue: ${{ github.repository }} #${{ inputs.issue_number }}
            - タイトル: ${{ steps.branch.outputs.issue_title }}
            - Issue 作成者: @${{ steps.branch.outputs.issue_user }}
            - 作業ブランチ: ${{ steps.branch.outputs.working_branch }}（既にチェックアウト済み。別ブランチを切らない）

            ## 手順
            1. `gh issue view ${{ inputs.issue_number }} --comments` で Issue 本文と全コメントを読む。
            2. **進捗 bot コメント** を探す（本文が `## opportunistic-task progress` で始まる github-actions[bot] 投稿、Issue に最大 1 件）:
               - 存在しない場合（= **初回**）: Issue 本文を元に下記テンプレートで新規コメントを投稿する。
                 ```
                 ## opportunistic-task progress

                 working_branch: ${{ steps.branch.outputs.working_branch }}

                 ### タスク概要
                 （Issue 本文を要約）

                 ### 完了条件 (DoD)
                 - [ ] ...

                 ### これまでの進捗
                 _まだなし_

                 ### 次にやること
                 - [ ] ...

                 ### 詰まり・要相談メモ
                 _なし_
                 ```
               - 存在する場合: その本文を読んで現状を把握する。`working_branch:` 行は **絶対に書き換えない**。
            3. **レビュー差し戻しの確認（最優先）**。Issue コメントの中に、本文が
               `<!-- review-feedback pr=<n> round=<r> -->` で始まる bot コメントがあるか調べる。
               ```
               gh api --paginate "repos/${{ github.repository }}/issues/${{ inputs.issue_number }}/comments" \
                 --jq '.[] | select((.body // "") | test("<!--[[:space:]]*review-feedback[[:space:]]")) | {id, body}'
               ```
               - 本文に `resolved: yes` の行が **無い** ものが 1 件以上あれば、それは
                 「自動レビューで critical 指摘が出て差し戻された」状態。**そちらを最優先で対応する**:
                 1. コメント内の PR 番号から `gh pr view <n> --comments` でレビュー本文を読み、
                    `## Critical` 配下の指摘を把握する。
                 2. 進捗 bot コメントの「完了条件 (DoD)」に critical 指摘を未チェック項目として追記し、
                    「次にやること」の先頭に置く（更新は下記 6 の絶対ルールに従う）。
                 3. 通常どおり 1〜5 件だけ直して commit する（一度に全部やらなくてよい）。
                 4. その review-feedback コメントの critical 指摘を **すべて** 直し切ったときだけ、
                    そのコメントの末尾に `resolved: yes` の行を追記する（バックアップ → `-F body=@file`
                    → 再取得検証は 6 と同じ手順で）。まだ残っているなら追記しない。
               - `resolved: yes` 付きのものだけ、または 1 件も無ければ、通常の長期タスクとして続ける。
            4. 「次にやること」から **1〜5 件** 選んで着手する（なるべく3件以上）。1 件が大きすぎるときは
               自分でさらに小分けして、小分けした分を含めて 5 件以内になるようにする。
            5. 実装→テスト/ビルド→commit。落ちたら直してから commit する。
            6. 進捗 bot コメントを **編集** して更新する:
               - 完了した項目に ✅
               - 新たに見えた「次にやること」を追記
               - 詰まり/要相談メモを追加（あれば）

               **更新の絶対ルール（過去にコメント全文を吹き飛ばす事故があったので厳守）**:
               1. **更新前に現状を必ずバックアップ**:
                  ```
                  COMMENT_ID=<対象 progress コメントの id>
                  gh api "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" --jq '.body' > /tmp/progress_body.before.md
                  ```
               2. **新しい本文は必ずファイルに書き出してから送る**:
                  ```
                  # 推奨: gh の --body-file を使う
                  gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" \
                    -F body=@/tmp/progress_body.after.md
                  ```
                  注意:
                  - `-F`（**大文字 F**）が `@file` 記法でファイル内容を読む。`-f`（小文字 f）は **文字列扱い** なので `@/tmp/...` という 22 文字がそのまま本文として書き込まれてしまう。**必ず `-F`**。
                  - `--body "<長文>"` で直接渡すのは、シェルエスケープの事故を招くので避ける。一旦ファイル経由。
               3. **書き込んだ後、即時に再取得して検証**:
                  ```
                  gh api "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" --jq '.body' > /tmp/progress_body.actual.md
                  ```
                  `/tmp/progress_body.actual.md` が `## opportunistic-task progress` で始まっていない、または 100 文字未満なら **壊れた**と判断し、`/tmp/progress_body.before.md` の内容を `-F body=@...` で復元する。復元後は Issue に新規コメントで「⚠️ progress コメント更新で異常を検知して復元した」旨を残して終了する。
            7. このブランチ（${{ steps.branch.outputs.working_branch }}）に対応する open PR がまだ無ければ、`gh pr create` で作る:
               - title: `[long-task] ${{ steps.branch.outputs.issue_title }} (#${{ inputs.issue_number }})`
               - body: `Issue #${{ inputs.issue_number }} の長期タスク。進捗は Issue 内の bot コメントを参照してください。`

               PR 本文には **必ずこの Issue 番号を `#${{ inputs.issue_number }}` の形で残す**
               （レビュー側 workflow が PR title / body の `#<n>` から元 Issue を逆引きして
               long-task-done を操作するため）。既存 PR がある場合もこの記述を消さない。
            8. **タスク全体が完了したと判断したとき**（進捗 bot コメントの「完了条件」が全 ✅、
               **かつ** 3 で見た未解決（`resolved: yes` 無し）の review-feedback コメントが 0 件）のみ:
               - `gh issue edit ${{ inputs.issue_number }} --add-label long-task-done`
               - Issue に `gh issue comment ${{ inputs.issue_number }} --body "@${{ steps.branch.outputs.issue_user }} 全タスクが完了しました。レビューをお願いします。"`
               - PR タイトル末尾に ` [ready for review]` を付与（任意）

               このラベルを付けると自動レビュー（claude-code-review.yml）の結果次第で
               **critical 指摘があればラベルが自動で外れ、次の dispatch に差し戻される**。
               それは想定挙動なので、差し戻されたら 3 の手順で淡々と直すこと。

            ## 禁止事項
            - 別ブランチを切る／main などのデフォルトブランチに直接 push
            - 1 dispatch で 6 件を超えるタスクをまとめて消化する（残りは次回 dispatch に任せる）
            - 進捗 bot コメントの `working_branch:` 行を勝手に書き換える
            - 中途半端な状態で long-task-done ラベルを付ける（完了条件すべて ✅ のときだけ）
            - 未解決の review-feedback コメント（`resolved: yes` 無し）が残っているのに
              long-task-done を付ける
            - review-feedback コメントの critical 指摘を「直さずに」`resolved: yes` を書く／
              コメント自体を削除・改変して差し戻しを消す
        env:
          # claude の Bash 内で `gh` を認証させるためのトークン。
          # GITHUB_TOKEN でも大抵は足りるが、Settings → Actions の
          # 「Allow GitHub Actions to create and approve pull requests」が OFF の repo では
          # 手順 7 の `gh pr create` が 403 で落ちる。PAT があればそちらを優先する
          #（未設定なら従来どおり GITHUB_TOKEN。後方互換）。
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN || github.token }}
          # submodule 内のコード修正まで踏み込む必要が出たとき、claude が git submodule update /
          # commit / push に使うトークン（CLAUDE.md の "submodule を操作するときのお願い" 節参照）。
          # secrets に未登録なら空文字が渡り、claude はその場合「権限外」と判断してコメントで終える。
          GH_TOKEN_SUBMODULE_RW: ${{ secrets.GH_TOKEN_SUBMODULE_RW }}

      # このジョブはコンテナ内で root として動くため、checkout / cargo が生成した
      # ファイルは host 上で root 所有になる。次に同じ self-hosted runner で
      # コンテナを使わないワークフロー(main 等)が動くと、runner ユーザーがそれらを
      # 削除できず checkout(git clean) が "permission denied" でコケる。
      # そこで (1) 所有者をマウント元 /__w(= runner ユーザー)に戻し、(2) 中身を削除する。
      # ビルドが途中で失敗しても必ず後始末されるよう if: always() を付ける。
      - name: Cleanup Directory
        if: always()
        run: |
          chown -R --reference=/__w /__w 2>/dev/null || true
          rm -rf -- "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* "$GITHUB_WORKSPACE"/..?* 2>/dev/null || true
